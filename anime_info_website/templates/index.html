<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AnimeVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('https://wallpapercave.com/wp/wp9426380.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .anime-card {
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 15px;
      padding: 10px;
    }
    #chat-box {
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="p-5">
  <h1 class="text-center mb-4">AnimeVerse 🌸</h1>

  <div class="mb-5">
    <input id="animeQuery" class="form-control" placeholder="Search Anime...">
    <button onclick="searchAnime()" class="btn btn-warning mt-2">Search</button>
    <div id="results" class="mt-3"></div>
  </div>

  <div class="card bg-dark text-white p-3">
    <h4>Ask Anime Assistant 🤖</h4>
    <div id="chat-box" class="mb-2 border p-2"></div>
    <input id="userMsg" class="form-control" placeholder="Ask something...">
    <button onclick="askBot()" class="btn btn-light mt-2">Ask</button>
  </div>

  <script>
    async function searchAnime() {
      const query = document.getElementById('animeQuery').value;
      const res = await fetch(`/search?q=${query}`);
      const data = await res.json();
      const results = data.data.map(anime => `
        <div class="anime-card mt-2 p-2">
          <h5>${anime.title}</h5>
          <img src="${anime.images.jpg.image_url}" width="100"><br>
          <small>${anime.synopsis?.substring(0, 150)}...</small>
        </div>
      `).join('');
      document.getElementById('results').innerHTML = results;
    }

    async function askBot() {
      const message = document.getElementById('userMsg').value;
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
      chatBox.innerHTML += `<div><strong>Bot:</strong> ${data.reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById('userMsg').value = '';
    }
  </script>
</body>
</html>
